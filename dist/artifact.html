<title>Graphical Verilog</title>
<style>/* Layout: three-pane editor (palette | canvas + waveform | inspector) under a single toolbar. */
:root {
  --accent: #4f9cff;
  --bg: #eef1f6; --panel: #ffffff; --panel2: #f3f5f9; --border: #d5dbe6; --text: #1b2230; --muted: #5d6779;
  --canvas: #fafbfd; --grid: #dfe4ec; --wire: #5c6680; --hi: #13a35a; --lo: #8fb7a0; --bus: #1f6fe0;
  --sel: #e08a00; --danger: #d93445; --ok: #13a35a; --warn: #c97a00; --body: #ffffff; --code: #f6f8fb;
  --shadow: 0 8px 30px rgba(20,30,60,.18); --kw: #7c3aed; --num: #c2410c; --str: #15803d;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1218; --panel: #161a22; --panel2: #1d2230; --border: #2a3142; --text: #e4e8f1; --muted: #8a93a8;
  --canvas: #11151c; --grid: #262d3b; --wire: #8b95ab; --hi: #3ddc84; --lo: #3a6650; --bus: #5aa9ff;
  --sel: #ffd166; --danger: #ff5c6c; --ok: #3ddc84; --warn: #ffb347; --body: #1b2130; --code: #0c0f15;
  --shadow: 0 8px 30px rgba(0,0,0,.45); --kw: #c792ea; --num: #f78c6c; --str: #c3e88d;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0f1218; --panel: #161a22; --panel2: #1d2230; --border: #2a3142; --text: #e4e8f1; --muted: #8a93a8;
  --canvas: #11151c; --grid: #262d3b; --wire: #8b95ab; --hi: #3ddc84; --lo: #3a6650; --bus: #5aa9ff;
  --sel: #ffd166; --danger: #ff5c6c; --ok: #3ddc84; --warn: #ffb347; --body: #1b2130; --code: #0c0f15;
  --shadow: 0 8px 30px rgba(0,0,0,.45); --kw: #c792ea; --num: #f78c6c; --str: #c3e88d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; cursor: pointer; white-space: nowrap; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.danger { color: var(--danger); }
button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
input[type=text], input[type=number], select, textarea { background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; padding: 4px 7px; width: 100%; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
textarea { font-family: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; font-size: 12px; min-height: 80px; resize: vertical; }
input[type=color] { width: 34px; height: 24px; padding: 0; border: 1px solid var(--border); border-radius: 4px; background: none; }
.mono { font-family: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; }

#app { display: grid; grid-template-rows: 46px 1fr 24px; height: 100%; }
#topbar { display: flex; align-items: center; gap: 8px; padding: 0 10px; background: var(--panel); border-bottom: 1px solid var(--border); min-width: 0; }
.brand { font-weight: 700; letter-spacing: .2px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.brand svg { width: 22px; height: 22px; }
#projName { width: 190px; background: transparent; border-color: transparent; font-weight: 600; }
#projName:hover { border-color: var(--border); }
.tabs { display: flex; gap: 2px; background: var(--panel2); padding: 3px; border-radius: 8px; }
.tabs button { border: none; background: none; padding: 4px 12px; }
.tabs button.active { background: var(--accent); color: #fff; }
.spacer { flex: 1; }
.group { display: flex; gap: 4px; align-items: center; }
#cycle { color: var(--muted); min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
.menu { position: relative; }
.menu-list { display: none; position: absolute; right: 0; top: calc(100% + 4px); background: var(--panel); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); min-width: 230px; padding: 4px; z-index: 50; }
.menu.open .menu-list { display: block; }
.menu-list button { display: block; width: 100%; text-align: left; border: none; background: none; padding: 6px 10px; }
.menu-list button:hover { background: var(--panel2); }
.menu-list hr { border: none; border-top: 1px solid var(--border); margin: 4px 0; }
.menu-list .label { color: var(--muted); font-size: 11px; padding: 4px 10px 2px; text-transform: uppercase; letter-spacing: .5px; }

main { display: grid; grid-template-columns: 240px 1fr 300px; min-height: 0; }
aside { background: var(--panel); overflow-y: auto; min-height: 0; }
#left { border-right: 1px solid var(--border); }
#right { border-left: 1px solid var(--border); }
#center { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
#stage { position: relative; flex: 1; min-height: 0; }
.canvas { position: absolute; inset: 0; width: 100%; height: 100%; background: var(--canvas); touch-action: none; user-select: none; display: block; }
#verilogView { position: absolute; inset: 0; overflow: auto; background: var(--code); padding: 14px 18px; display: none; }
#verilogView pre { margin: 0; font: 12.5px/1.55 ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; white-space: pre; tab-size: 2; }
.k { color: var(--kw); } .n { color: var(--num); } .cm { color: var(--muted); font-style: italic; } .s { color: var(--str); }

.section { padding: 10px 12px; border-bottom: 1px solid var(--border); }
.section h3 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); display: flex; align-items: center; justify-content: space-between; }
.section h3 button { padding: 0 7px; font-size: 13px; text-transform: none; }
.list-item { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 6px; cursor: pointer; }
.list-item:hover { background: var(--panel2); }
.list-item.active { background: color-mix(in srgb, var(--accent) 22%, transparent); }
.list-item .tag { margin-left: auto; font-size: 10px; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
.palette-cat { margin-bottom: 8px; }
.palette-cat > div:first-child { font-size: 11px; color: var(--muted); margin: 6px 0 4px; display: flex; align-items: center; gap: 6px; }
.palette-cat .dot { width: 8px; height: 8px; border-radius: 50%; }
.palette-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.pal { background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; padding: 5px 7px; cursor: grab; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-left: 3px solid var(--c, var(--accent)); }
.pal:hover { border-color: var(--accent); border-left-color: var(--c, var(--accent)); }
.field { margin-bottom: 9px; }
.field label { display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 3px; }
.field .row { display: flex; gap: 6px; align-items: center; }
.check { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; cursor: pointer; }
.help { color: var(--muted); font-size: 11.5px; margin: 4px 0 8px; }
.btnrow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.msg { font-size: 12px; padding: 6px 8px; border-radius: 6px; margin-bottom: 6px; border-left: 3px solid var(--warn); background: var(--panel2); word-break: break-word; }
.msg.err { border-left-color: var(--danger); }
.simrow { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center; margin-bottom: 6px; }
.simrow .name { font-family: ui-monospace, Menlo, monospace; }
.simrow input { width: 110px; }
.bit { min-width: 34px; font-family: ui-monospace, Menlo, monospace; }
.bit.one { background: var(--hi); color: #062; border-color: var(--hi); }
.val { font-family: ui-monospace, Menlo, monospace; color: var(--accent); }
kbd { font: 11px ui-monospace, Menlo, monospace; background: var(--panel2); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
.shortcuts { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 12px; color: var(--muted); }

#wave { height: 190px; border-top: 1px solid var(--border); background: var(--panel); display: none; flex-direction: column; }
#wave.show { display: flex; }
#wave .bar { display: flex; align-items: center; gap: 6px; padding: 3px 8px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted); }
#waveBody { flex: 1; overflow: auto; }
#status { display: flex; align-items: center; gap: 14px; padding: 0 10px; background: var(--panel); border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; }
#status .err { color: var(--danger); }
#status .ok { color: var(--ok); }

.toolbar { position: absolute; top: 10px; left: 10px; display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 4px; box-shadow: var(--shadow); z-index: 5; }
.zoombar { position: absolute; bottom: 10px; right: 10px; display: flex; gap: 4px; z-index: 5; }
.banner { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: var(--danger); color: #fff; padding: 6px 12px; border-radius: 8px; z-index: 6; max-width: 70%; box-shadow: var(--shadow); }
.floating-input { position: absolute; z-index: 20; width: 120px; box-shadow: var(--shadow); }

dialog { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 12px; padding: 0; box-shadow: var(--shadow); width: min(640px, 94vw); max-height: 88vh; }
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog .head { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); font-weight: 600; }
dialog .body { padding: 14px 16px; overflow-y: auto; max-height: calc(88vh - 110px); }
dialog .foot { padding: 10px 16px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; }
.colors { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px 16px; }
.colors label { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; }
dialog h4 { margin: 14px 0 8px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
dialog h4:first-child { margin-top: 0; }

/* SVG */
.comp-body { stroke: var(--wire); stroke-width: 1.5; }
.comp text { fill: var(--text); font: 11px ui-monospace, Menlo, monospace; pointer-events: none; }
.comp .title { font: 600 12px system-ui, sans-serif; }
.comp .lbl { fill: var(--muted); font-size: 10px; }
.comp.selected .comp-body { stroke: var(--sel); stroke-width: 2.5; }
.comp { cursor: move; }
.port { fill: var(--panel); stroke: var(--wire); stroke-width: 1.5; cursor: crosshair; }
.port:hover, .port.hot { fill: var(--accent); stroke: var(--accent); r: 6; }
.wire { fill: none; stroke: var(--wire); stroke-width: 2; stroke-linejoin: round; }
.wire.bus { stroke-width: 3.5; }
.wire.hi { stroke: var(--hi); }
.wire.lo { stroke: var(--lo); }
.wire.busv { stroke: var(--bus); }
.wire.selected { stroke: var(--sel) !important; }
.wire-hit { fill: none; stroke: transparent; stroke-width: 12; cursor: pointer; }
.wlabel { font: 10px ui-monospace, Menlo, monospace; fill: var(--muted); pointer-events: none; }
.wval { font: 600 10.5px ui-monospace, Menlo, monospace; fill: var(--bus); pointer-events: none; paint-order: stroke; stroke: var(--canvas); stroke-width: 3px; }
.ghost { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 5 4; pointer-events: none; }
.selbox { fill: color-mix(in srgb, var(--accent) 12%, transparent); stroke: var(--accent); stroke-dasharray: 4 3; pointer-events: none; }
.state circle.ring { stroke: var(--wire); stroke-width: 2; }
.state.selected circle.ring { stroke: var(--sel); stroke-width: 3; }
.state.active circle.ring { stroke: var(--hi); stroke-width: 4; filter: drop-shadow(0 0 6px var(--hi)); }
.state text { fill: var(--text); pointer-events: none; text-anchor: middle; }
.state { cursor: move; }
.trans path.line { fill: none; stroke: var(--wire); stroke-width: 2; }
.trans.selected path.line { stroke: var(--sel); stroke-width: 3; }
.trans.active path.line { stroke: var(--hi); stroke-width: 3; }
.trans text { font: 11.5px ui-monospace, Menlo, monospace; fill: var(--text); paint-order: stroke; stroke: var(--canvas); stroke-width: 4px; pointer-events: none; text-anchor: middle; }
.trans .hit { fill: none; stroke: transparent; stroke-width: 14; cursor: pointer; }
.wv-name { font: 11.5px ui-monospace, Menlo, monospace; fill: var(--text); }
.wv-val { font: 10px ui-monospace, Menlo, monospace; fill: var(--text); }
.wv-grid { stroke: var(--grid); }
.empty-hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); pointer-events: none; text-align: center; padding: 20px; }

@media (max-width: 900px) {
  main { grid-template-columns: 190px 1fr; }
  #right { position: absolute; right: 0; top: 46px; bottom: 24px; width: 280px; z-index: 30; box-shadow: var(--shadow); display: none; }
  #right.open { display: block; }
  #projName { display: none; }
}
@media (max-width: 620px) {
  main { grid-template-columns: 1fr; }
  #left { display: none; position: absolute; left: 0; top: 46px; bottom: 24px; width: 230px; z-index: 30; box-shadow: var(--shadow); }
  #left.open { display: block; }
  .brand span { display: none; }
}
.narrow-only { display: none; }
#topbar { overflow-x: auto; scrollbar-width: none; }
#topbar > * { flex-shrink: 0; }
@media (max-width: 900px) { .narrow-only { display: inline-block; } }
button.danger-fill { background: var(--danger); border-color: var(--danger); }
</style>
<div id="app">
  <header id="topbar">
    <button class="narrow-only" id="toggleLeft" title="Panels">☰</button>
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h5M3 18h5M8 3v6M8 15v6" stroke="var(--accent)"/><path d="M8 4h5a8 8 0 0 1 0 16H8z"/><path d="M21 12h-0"/></svg>
      <span>Graphical Verilog</span>
    </div>
    <input id="projName" type="text" title="Project name">
    <nav class="tabs" id="tabs">
      <button data-tab="circuit">Circuit</button>
      <button data-tab="fsm">State machines</button>
      <button data-tab="verilog">Verilog</button>
    </nav>
    <div class="spacer"></div>
    <div class="group" id="simControls">
      <button id="simToggle" title="Start/stop simulation (Ctrl+E)">▶ Simulate</button>
      <button id="simReset" title="Reset all registers and state machines (R)">⟲ Reset</button>
      <button id="simStep" title="One clock cycle (Space)">⏭ Step</button>
      <button id="simRun" title="Run the clock continuously">⏵ Run</button>
      <span id="cycle"></span>
    </div>
    <div class="group">
      <button id="undoBtn" title="Undo (Ctrl+Z)">↶</button>
      <button id="redoBtn" title="Redo (Ctrl+Shift+Z)">↷</button>
    </div>
    <div class="menu" id="fileMenu">
      <button id="fileBtn">File ▾</button>
      <div class="menu-list" id="fileList"></div>
    </div>
    <button id="settingsBtn" title="Settings">⚙</button>
    <button class="narrow-only" id="toggleRight" title="Inspector">ⓘ</button>
  </header>
  <main>
    <aside id="left"></aside>
    <section id="center">
      <div id="stage">
        <svg id="circuitCanvas" class="canvas"></svg>
        <svg id="fsmCanvas" class="canvas" style="display:none"></svg>
        <div id="verilogView"><pre id="verilogCode"></pre></div>
        <div id="overlay"></div>
      </div>
      <div id="wave">
        <div class="bar"><b>Waveform</b><span id="waveInfo"></span><span class="spacer"></span>
          <button id="waveZoomOut" title="Narrower cycles">−</button><button id="waveZoomIn" title="Wider cycles">+</button>
          <button id="waveClear" title="Clear recorded history">Clear</button></div>
        <div id="waveBody"></div>
      </div>
    </section>
    <aside id="right"></aside>
  </main>
  <footer id="status"></footer>
</div>
<dialog id="settingsDlg"></dialog>
<dialog id="askDlg" style="width:min(420px,94vw)"></dialog>

<script>// ---- expr.js ----
// Verilog-style expression engine: tokenizer, parser, width rules and BigInt evaluator.
// Used by custom expression blocks, constants and FSM conditions/actions.
(function () {
  const GV = (globalThis.GV = globalThis.GV || {});

  const mask = (w) => (w <= 0 ? 0n : (1n << BigInt(w)) - 1n);
  const CMP = new Set(['==', '!=', '===', '!==', '<', '<=', '>', '>=']);
  const REDUCE = new Set(['&', '~&', '|', '~|', '^', '~^']);

  class ExprError extends Error {}

  const TOKEN_RE =
    /\s+|\/\/[^\n]*|\/\*[\s\S]*?\*\/|(\d*\s*'[sS]?[bBoOdDhH]\s*[0-9a-fA-FxXzZ_?]+)|(\d[\d_]*)|([A-Za-z_][A-Za-z0-9_$]*)|(===|!==|==|!=|<=|>=|&&|\|\||<<|>>|~&|~\||~\^|\^~|[-+*\/%&|^~!<>?:()\[\]{},=;])/y;

  function tokenize(src) {
    const toks = [];
    TOKEN_RE.lastIndex = 0;
    let pos = 0;
    while (pos < src.length) {
      TOKEN_RE.lastIndex = pos;
      const m = TOKEN_RE.exec(src);
      if (!m) throw new ExprError(`Unexpected character '${src[pos]}' at ${pos + 1}`);
      pos = TOKEN_RE.lastIndex;
      if (m[1]) toks.push({ k: 'num', ...parseLiteral(m[1]) });
      else if (m[2]) toks.push({ k: 'num', v: BigInt(m[2].replace(/_/g, '')), w: 32, unsized: true });
      else if (m[3]) toks.push({ k: 'id', s: m[3] });
      else if (m[4]) toks.push({ k: 'op', s: m[4] === '^~' ? '~^' : m[4] });
    }
    toks.push({ k: 'eof' });
    return toks;
  }

  function parseLiteral(text) {
    const t = text.replace(/\s+/g, '');
    const m = /^(\d*)'[sS]?([bBoOdDhH])([0-9a-fA-FxXzZ_?]+)$/.exec(t);
    if (!m) throw new ExprError('Bad literal ' + text);
    const base = { b: 2, o: 8, d: 10, h: 16 }[m[2].toLowerCase()];
    const digits = m[3].replace(/_/g, '').replace(/[xXzZ?]/g, '0');
    let v = 0n;
    for (const ch of digits) {
      const d = parseInt(ch, 16);
      if (isNaN(d) || d >= base) throw new ExprError('Bad digit in ' + text);
      v = v * BigInt(base) + BigInt(d);
    }
    const w = m[1] ? parseInt(m[1], 10) : 32;
    if (w < 1) throw new ExprError('Bad width in ' + text);
    return { v: v & mask(w), w, unsized: !m[1] };
  }

  // Binary precedence, low to high (Verilog order).
  const BIN_LEVELS = [
    ['||'],
    ['&&'],
    ['|'],
    ['^', '~^'],
    ['&'],
    ['==', '!=', '===', '!=='],
    ['<', '<=', '>', '>='],
    ['<<', '>>'],
    ['+', '-'],
    ['*', '/', '%'],
  ];

  class Parser {
    constructor(src) {
      this.src = src;
      this.toks = tokenize(src);
      this.i = 0;
    }
    peek() { return this.toks[this.i]; }
    next() { return this.toks[this.i++]; }
    isOp(s) { const t = this.peek(); return t.k === 'op' && t.s === s; }
    expect(s) {
      const t = this.next();
      if (t.k !== 'op' || t.s !== s) throw new ExprError(`Expected '${s}' but found ${describe(t)}`);
    }
    expr() {
      const c = this.bin(0);
      if (this.isOp('?')) {
        this.next();
        const a = this.expr();
        this.expect(':');
        const b = this.expr();
        return { t: 'tern', c, a, b };
      }
      return c;
    }
    bin(level) {
      if (level >= BIN_LEVELS.length) return this.unary();
      let left = this.bin(level + 1);
      for (;;) {
        const t = this.peek();
        if (t.k === 'op' && BIN_LEVELS[level].includes(t.s)) {
          this.next();
          const right = this.bin(level + 1);
          left = { t: 'bin', op: t.s, a: left, b: right };
        } else return left;
      }
    }
    unary() {
      const t = this.peek();
      if (t.k === 'op' && ['!', '~', '-', '+', '&', '|', '^', '~&', '~|', '~^'].includes(t.s)) {
        this.next();
        return { t: 'un', op: t.s, a: this.unary() };
      }
      return this.primary();
    }
    primary() {
      const t = this.next();
      if (t.k === 'num') return { t: 'num', v: t.v, w: t.w };
      if (t.k === 'id') {
        let node = { t: 'id', name: t.s };
        if (this.isOp('[')) {
          this.next();
          const hi = this.expr();
          if (this.isOp(':')) {
            this.next();
            const lo = this.expr();
            this.expect(']');
            node = { t: 'rng', name: t.s, hi: constEval(hi), lo: constEval(lo) };
            if (node.hi < node.lo) throw new ExprError(`Range [${node.hi}:${node.lo}] must be [high:low]`);
          } else {
            this.expect(']');
            node = { t: 'idx', name: t.s, i: hi };
          }
        }
        return node;
      }
      if (t.k === 'op' && t.s === '(') {
        const e = this.expr();
        this.expect(')');
        return e;
      }
      if (t.k === 'op' && t.s === '{') {
        const first = this.expr();
        if (this.isOp('{')) {
          // replication {n{a,b}}

            case '>': r = a > b; break;

        if (op === '||') return evaluate(n.a, E, 0) !== 0n || evaluate(n.b, E, 0) !== 0n ? 1n : 0n;

          case '%': return b === 0n ? m : (a % b) & m;

  });
})();

    let w = 60;
    if (['custom', 'module', 'fsmblock', 'box'].includes(t.shape)) {
      const longest = (arr) => arr.reduce((m, p) => Math.max(m, p.name.length), 0);
      w = Math.max(80, Math.ceil(((longest(ports.ins) + longest(ports.outs)) * 7 + 40) / GRID) * GRID);
      const title = blockTitle(c, project);
      w = Math.max(w, Math.ceil((title.length * 8 + 20) / GRID) * GRID);
    }
    if (t.shape === 'mux') w = 40;
    if (t.shape === 'reg') w = 80;
    return { w, h: (rows + 1) * GRID };
  }

  // Port positions relative to component origin.
  function portLayout(c, project) {
    const ports = getPorts(c, project);
    const size = getSize(c, project, ports);
    const place = (list, x) => {
      const n = list.length;
      const top = Math.round((size.h - (n - 1) * GRID) / 2 / 10) * 10;
      return list.map((p, i) => ({ ...p, x, y: top + i * GRID }));
    };
    let ins = place(ports.ins, 0);
    if (c.type === 'mux') {
      // Data inputs on the left, select on the bottom edge.
      const data = place(ports.ins.slice(0, -1), 0);
      const sel = { ...ports.ins[ports.ins.length - 1], x: size.w / 2, y: size.h - 8, bottom: true };
      ins = [...data, sel];
    }
    return { ins, outs: place(ports.outs, size.w), size };
  }

  function blockTitle(c, project) {
    const t = TYPES[c.type];
    switch (c.type) {
      case 'expr': return c.props.title || 'expr';
      case 'lib': return c.props.lib || '(library)';
      case 'sub': return c.props.circuit || '(circuit)';
      case 'fsm': return c.props.fsm || '(FSM)';
      case 'op': return c.props.op;
      case 'adder': return 'ADD';
      case 'decoder': return 'DEC';
      case 'slice': return `[${c.props.hi}:${c.props.lo}]`;
      case 'concat': return '{ , }';
      case 'extend': return c.props.sign ? 'SEXT' : 'ZEXT';
      case 'register': return 'REG';
      case 'counter': return c.props.down ? 'CNT ↓' : 'CNT';
      default: return t ? t.label : c.type;
    }
  }

  function defaultProps(type) {
    return JSON.parse(JSON.stringify(TYPES[type].defaults));
  }

  function newComponent(type, x, y, extraProps) {
    return { id: uid('c'), type, x, y, label: '', props: { ...defaultProps(type), ...(extraProps || {}) } };
  }

  function newCircuit(name) { return { name, components: [], wires: [] }; }

  function newFsm(name) {
    const s0 = { id: uid('s'), name: 'IDLE', x: 200, y: 200, outputs: '', color: '' };
    return {
      name, inputs: 'go:1', outputs: 'busy:1', encoding: 'binary', exposeState: false,
      states: [s0], transitions: [], reset: s0.id,
    };
  }

  function defaultSettings() {
    return {
      theme: 'system', accent: '#4f9cff', gateStyle: 'ansi', wireStyle: 'orthogonal', grid: true, snap: true,
      showWidths: true, radix: 'auto', simSpeed: 4, animateWires: true,
      catColors: {
        'Inputs / outputs': '#2f9e6e', 'Logic gates': '#4f9cff', Routing: '#a072ff', Arithmetic: '#e5a13a',
        Sequential: '#e0566b', Custom: '#1fb5c0', Library: '#1fb5c0', Subcircuits: '#8d99ae', 'State machines': '#f06fb5', Annotations: '#b8a34a',
      },
      verilog: { clock: 'clk', reset: 'rst', resetStyle: 'sync', resetActiveLow: false, indent: 2, header: true, outputReg: false },
    };
  }

  function newProject() {
    return { version: 1, name: 'Untitled design', top: 'main', circuits: { main: newCircuit('main') }, fsms: {}, library: {}, settings: defaultSettings() };
  }

  // Fill in fields that older/hand-written project files may lack.
  function normalizeProject(p) {
    const d = defaultSettings();
    p.settings = { ...d, ...(p.settings || {}) };
    p.settings.verilog = { ...d.verilog, ...(p.settings.verilog || {}) };
    p.settings.catColors = { ...d.catColors, ...(p.settings.catColors || {}) };
    p.circuits = p.circuits || {};
    p.fsms = p.fsms || {};
    p.library = p.library || {};
    if (!Object.keys(p.circuits).length) p.circuits.main = newCircuit('main');
    if (!p.circuits[p.top]) p.top = Object.keys(p.circuits)[0];
    for (const c of Object.values(p.circuits)) {
      c.components = c.components || [];
      c.wires = c.wires || [];
      for (const comp of c.components) comp.props = { ...(TYPES[comp.type] ? defaultProps(comp.type) : {}), ...(comp.props || {}) };
    }
    for (const f of Object.values(p.fsms)) {
      f.states = f.states || []; f.transitions = f.transitions || [];
      f.encoding = f.encoding || 'binary';
      if (!f.states.find((s) => s.id === f.reset) && f.states[0]) f.reset = f.states[0].id;
    }
    return p;
  }

  Object.assign(GV, {
    uid, sanitize, TYPES, OPERATORS, isCmp, GATE_OPS, getPorts, getSize, portLayout, blockTitle, newComponent, newCircuit,
    newFsm, newProject, normalizeProject, defaultSettings, circuitPorts, fsmStateBits, wrapText, GRID, clampW, safeSpec, VERILOG_KEYWORDS,
  });
})();

// ---- sim.js ----
// Cycle-based simulator. Combinational logic settles by fixed-point iteration;
// sequential elements (registers, counters, FSMs) update together on each clock step.
(function () {
  const GV = (globalThis.GV = globalThis.GV || {});
  const { mask } = GV;

  class SimError extends Error {}

  // Compile "y = expr; t = expr" against known inputs/outputs; unknown lhs become internal wires.
  function compileAssigns(code, inPorts, outPorts, where) {
    let assigns;
    try { assigns = GV.parseAssignments(code); } catch (e) { throw new SimError(`${where}: ${e.message}`); }
    const widths = new Map();
    inPorts.forEach((p) => widths.set(p.name, p.w ?? p.width));
    const outW = new Map(outPorts.map((p) => [p.name, p.w ?? p.width]));
    const W = (n) => widths.get(n);
    const compiled = [];
    for (const a of assigns) {
      if (widths.has(a.lhs) && !outW.has(a.lhs)) throw new SimError(`${where}: cannot assign to input '${a.lhs}'`);
      let selfW;
      try { selfW = GV.selfWidth(a.ast, W); } catch (e) { throw new SimError(`${where}: ${e.message}`); }
      const w = outW.has(a.lhs) ? outW.get(a.lhs) : selfW;
      widths.set(a.lhs, w);
      compiled.push({ lhs: a.lhs, ast: a.ast, w, internal: !outW.has(a.lhs), src: a.src });
    }
    return { compiled, widths };
  }

  function runAssigns(prog, values) {
    const E = { val: (n) => values.get(n) ?? 0n, w: (n) => prog.widths.get(n) };
    for (const a of prog.compiled) values.set(a.lhs, GV.evaluate(a.ast, E, a.w) & mask(a.w));
    return values;
  }

  const OP_AST = {};
  function opAst(op) {
    return OP_AST[op] || (OP_AST[op] = GV.parseExpr('a ' + op + ' b'));
  }

  class CircuitSim {
    constructor(project, name, path = []) {
      if (path.includes(name)) throw new SimError('Subcircuit includes itself: ' + [...path, name].join(' → '));
      const circ = project.circuits[name];
      if (!circ) throw new SimError(`Circuit '${name}' does not exist`);
      this.project = project;
      this.name = name;
      this.comps = [...circ.components].filter((c) => GV.TYPES[c.type] && c.type !== 'note').sort((a, b) => a.x - b.x || a.y - b.y);
      this.ports = new Map();
      this.drivers = new Map();
      this.nets = new Map();
      this.state = new Map();
      this.children = new Map();
      this.programs = new Map();
      this.consts = new Map();
      this.inputs = {};
      this.outputs = {};
      this.probes = {};
      for (const c of this.comps) this.ports.set(c.id, GV.getPorts(c, project));
      for (const wire of circ.wires) {
        const key = wire.to.c + ':' + wire.to.p;
        if (this.drivers.has(key)) throw new SimError(`Input pin ${wire.to.p} has more than one driver`);
        this.drivers.set(key, wire.from.c + ':' + wire.from.p);
      }
      for (const c of this.comps) this.prepareComp(c, path);
      this.reset();
    }

    label(c) { return c.label || GV.blockTitle(c, this.project); }

    prepareComp(c, path) {
      const P = this.ports.get(c.id);
      const where = `${this.name}/${this.label(c)}`;
      switch (c.type) {
        case 'const':
        case 'register':
        case 'counter': {
          const key = c.type === 'const' ? 'value' : 'reset';
          try { this.consts.set(c.id, GV.evalConst(c.props[key] || '0', GV.clampW(c.props.width))); } catch (e) { throw new SimError(`${where}: ${e.message}`); }
          break;
        }
        case 'expr':
          this.programs.set(c.id, compileAssigns(c.props.code, P.ins, P.outs, where));
          break;
        case 'lib': {
          const def = this.project.library[c.props.lib];
          if (!def) throw new SimError(`${where}: library block '${c.props.lib}' not found`);
          this.programs.set(c.id, compileAssigns(def.code, P.ins, P.outs, where));
          break;
        }
        case 'sub':
          this.children.set(c.id, new CircuitSim(this.project, c.props.circuit, [...path, this.name]));
          break;
        case 'fsm':
          if (!this.project.fsms[c.props.fsm]) throw new SimError(`${where}: state machine '${c.props.fsm}' not found`);
          this.children.set(c.id, new FsmSim(this.project, c.props.fsm));
          break;
      }
    }

    reset() {
      for (const c of this.comps) {
        if (c.type === 'register' || c.type === 'counter') this.state.set(c.id, this.consts.get(c.id));
      }
      for (const ch of this.children.values()) ch.reset();
      this.nets.clear();
    }

    pin(c, i) {
      const p = this.ports.get(c.id).ins[i];
      const src = this.drivers.get(c.id + ':' + p.name);
      if (!src) return 0n;
      return (this.nets.get(src) ?? 0n) & mask(p.w);
    }

    evalComp(c) {
      const P = this.ports.get(c.id);
      const ins = P.ins.map((_, i) => this.pin(c, i));
      const out = {};
      const t = c.type;
      switch (t) {
        case 'input': out.out = BigInt(this.inputs[GV.sanitize(c.props.name)] ?? 0n) & mask(P.outs[0].w); break;
        case 'output': this.outputs[GV.sanitize(c.props.name)] = ins[0]; break;
        case 'probe': this.probes[c.id] = ins[0]; break;
        case 'const': out.y = this.consts.get(c.id); break;
        case 'and': case 'nand': case 'or': case 'nor': case 'xor': case 'xnor': {
          const m = mask(P.outs[0].w);
          let v = ins[0];
          for (let i = 1; i < ins.length; i++) {
            if (t === 'and' || t === 'nand') v &= ins[i];
            else if (t === 'or' || t === 'nor') v |= ins[i];
            else v ^= ins[i];
          }
          if (t === 'nand' || t === 'nor' || t === 'xnor') v = ~v & m;
          out.y = v & m;
          break;
        }
        case 'not': out.y = ~ins[0] & mask(P.outs[0].w); break;
        case 'mux': { const sel = Number(ins[ins.length - 1]); out.y = ins[sel] ?? 0n; break; }
        case 'decoder': out.y = (1n << ins[0]) & mask(P.outs[0].w); break;
        case 'slice': out.y = (ins[0] >> BigInt(c.props.lo | 0)) & mask(P.outs[0].w); break;
        case 'concat': {
          let v = 0n;
          P.ins.forEach((p, i) => { v = (v << BigInt(p.w)) | ins[i]; });
          out.y = v;
          break;
        }
        case 'extend': {
          const fw = P.ins[0].w, tw = P.outs[0].w;
          let v = ins[0];
          if (c.props.sign && (v >> BigInt(fw - 1)) & 1n) v |= mask(tw) ^ mask(fw);
          out.y = v;
          break;
        }
        case 'op': {
          const widths = { a: P.ins[0].w, b: P.ins[1].w };
          const E = { val: (n) => (n === 'a' ? ins[0] : ins[1]), w: (n) => widths[n] };
          out.y = GV.evaluate(opAst(c.props.op), E, P.outs[0].w) & mask(P.outs[0].w);
          break;
        }
        case 'adder': {
          const w = P.outs[0].w;
          const s = ins[0] + ins[1] + ins[2];
          out.sum = s & mask(w);
          out.cout = (s >> BigInt(w)) & 1n;
          break;
        }
        case 'register':
        case 'counter':
          out.q = this.state.get(c.id);
          break;
        case 'expr':
        case 'lib': {
          const prog = this.programs.get(c.id);
          const vals = new Map(P.ins.map((p, i) => [p.name, ins[i]]));
          runAssigns(prog, vals);
          for (const p of P.outs) out[p.name] = (vals.get(p.name) ?? 0n) & mask(p.w);
          break;
        }
        case 'sub': {
          const child = this.children.get(c.id);
          const inObj = {};
          P.ins.forEach((p, i) => { inObj[p.name] = ins[i]; });
          const res = child.settle(inObj);
          for (const p of P.outs) out[p.name] = (res[p.name] ?? 0n) & mask(p.w);
          break;
        }
        case 'fsm': {
          const child = this.children.get(c.id);
          const inObj = {};
          P.ins.forEach((p, i) => { inObj[p.name] = ins[i]; });
          const res = child.settle(inObj);
          for (const p of P.outs) out[p.name] = (res[p.name] ?? 0n) & mask(p.w);
          break;
        }
      }
      return out;
    }

    settle(inputs) {
      if (inputs) this.inputs = { ...inputs };
      const limit = this.comps.length * 2 + 10;
      for (let iter = 0; iter < limit; iter++) {
        let changed = false;
        for (const c of this.comps) {
          const out = this.evalComp(c);
          for (const k in out) {
            const key = c.id + ':' + k;
            if (this.nets.get(key) !== out[k]) { this.nets.set(key, out[k]); changed = true; }
          }
        }
        if (!changed) return this.outputs;
      }
      throw new SimError(`Circuit '${this.name}' does not settle: there is a combinational loop. Put a register in the loop.`);
    }

    // Phase 1 of a clock edge: compute next state from the settled values.
    prepare() {
      this.next = new Map();
      for (const c of this.comps) {
        if (c.type === 'register') {
          const d = this.pin(c, 0);
          const en = c.props.enable ? this.pin(c, 1) : 1n;
          this.next.set(c.id, en ? d : this.state.get(c.id));
        } else if (c.type === 'counter') {
          const w = GV.clampW(c.props.width);
          const en = this.pin(c, 0);
          const clr = c.props.clear ? this.pin(c, 1) : 0n;
          const cur = this.state.get(c.id);
          const step = BigInt(Math.max(1, c.props.step | 0));
          let nv = cur;
          if (clr) nv = this.consts.get(c.id);
          else if (en) nv = (c.props.down ? cur - step : cur + step) & mask(w);
          this.next.set(c.id, nv);
        }
      }
      for (const ch of this.children.values()) ch.prepare();
    }

    // Phase 2: commit.
    commit() {
      for (const [id, v] of this.next) this.state.set(id, v);
      for (const ch of this.children.values()) ch.commit();
    }

    // Read-only view of FSM instances for the UI (current state names).
    fsmStates() {
      const res = {};
      for (const [id, ch] of this.children) if (ch instanceof FsmSim) res[id] = ch.currentName();
      return res;
    }
  }

  class FsmSim {
    constructor(project, name) {
      const f = project.fsms[name];
      if (!f) throw new SimError(`State machine '${name}' does not exist`);
      if (!f.states.length) throw new SimError(`State machine '${name}' has no states`);
      this.f = f;
      this.name = name;
      this.ins = safe(() => GV.parsePortSpec(f.inputs), `${name} inputs`).map((p) => ({ name: p.name, w: p.width }));
      this.outs = safe(() => GV.parsePortSpec(f.outputs), `${name} outputs`).map((p) => ({ name: p.name, w: p.width, def: p.def }));
      this.defaults = new Map();
      for (const o of this.outs) {
        this.defaults.set(o.name, o.def ? safe(() => GV.evalConst(o.def, o.w), `${name}: default of ${o.name}`) : 0n);
      }
      this.widths = new Map([...this.ins, ...this.outs].map((p) => [p.name, p.w]));
      this.stateIndex = new Map(f.states.map((s, i) => [s.id, i]));
      this.moore = new Map();
      for (const s of f.states) this.moore.set(s.id, compileAssigns(s.outputs || '', this.ins, this.outs, `${name}/${s.name} outputs`));
      this.trans = new Map(f.states.map((s) => [s.id, []]));
      for (const t of f.transitions) {
        if (!this.trans.has(t.from) || !this.stateIndex.has(t.to)) continue;
        const where = `${name}: transition ${stateName(f, t.from)} → ${stateName(f, t.to)}`;
        let cond = null;
        if (t.cond && t.cond.trim() && t.cond.trim() !== '1') {
          cond = safe(() => GV.parseExpr(t.cond), where);
          safe(() => GV.selfWidth(cond, (n) => this.widths.get(n)), where);
        }
        this.trans.get(t.from).push({ t, cond, actions: compileAssigns(t.actions || '', this.ins, this.outs, where + ' actions') });
      }
      this.reset();
    }
    reset() { this.cur = this.f.reset; this.nextState = this.cur; this.activeTransition = null; }
    currentName() { return stateName(this.f, this.cur); }
    encode(id) {
      const i = this.stateIndex.get(id) ?? 0;
      if (this.f.encoding === 'onehot') return 1n << BigInt(i);
      if (this.f.encoding === 'gray') return BigInt(i ^ (i >> 1));
      return BigInt(i);
    }
    settle(inputs) {
      const vals = new Map();
      for (const p of this.ins) vals.set(p.name, BigInt(inputs[p.name] ?? 0n) & mask(p.w));
      for (const [k, v] of this.defaults) vals.set(k, v);
      runAssigns(this.moore.get(this.cur), vals);
      const E = { val: (n) => vals.get(n) ?? 0n, w: (n) => this.widths.get(n) };
      this.activeTransition = null;
      this.nextState = this.cur;
      for (const tr of this.trans.get(this.cur) || []) {
        if (!tr.cond || GV.evaluate(tr.cond, E, 0) !== 0n) {
          this.activeTransition = tr.t.id;
          this.nextState = tr.t.to;
          runAssigns(tr.actions, vals);
          break;
        }
      }
      const res = {};
      for (const p of this.outs) res[p.name] = vals.get(p.name) ?? 0n;
      res.state = this.encode(this.cur);
      return res;
    }
    prepare() { this.pending = this.nextState; }
    commit() { this.cur = this.pending; }
  }

  function stateName(f, id) { const s = f.states.find((x) => x.id === id); return s ? s.name : '?'; }
  function safe(fn, where) { try { return fn(); } catch (e) { throw new SimError(`${where}: ${e.message}`); } }

  // Top-level driver used by the UI: owns input values and records history for waveforms/testbenches.
  class Simulator {
    constructor(project, circuitName) {
      this.project = project;
      this.circuitName = circuitName;
      this.root = new CircuitSim(project, circuitName);
      const ports = GV.circuitPorts(project, circuitName);
      this.inPorts = ports.ins;
      this.outPorts = ports.outs;
      this.inputs = {};
      for (const p of this.inPorts) this.inputs[p.name] = 0n;
      this.history = [];
      this.cycle = 0;
      this.settle();
    }
    settle() { this.root.settle(this.inputs); }
    setInput(name, v) { this.inputs[name] = BigInt(v); this.settle(); }
    sample() {
      return { cycle: this.cycle, inputs: { ...this.inputs }, outputs: { ...this.root.outputs }, probes: { ...this.root.probes } };
    }
    step() {
      this.settle();
      this.history.push(this.sample());
      if (this.history.length > 5000) this.history.shift();
      this.root.prepare();
      this.root.commit();
      this.cycle++;
      this.settle();
    }
    reset() {
      this.history.push({ reset: true, cycle: this.cycle });
      this.root.reset();
      this.settle();
    }
  }

  class FsmSimulator {
    constructor(project, name) {
      this.fsm = new FsmSim(project, name);
      this.inputs = {};
      for (const p of this.fsm.ins) this.inputs[p.name] = 0n;
      this.history = [];
      this.cycle = 0;
      this.settle();
    }
    settle() { this.outputs = this.fsm.settle(this.inputs); }
    setInput(name, v) { this.inputs[name] = BigInt(v); this.settle(); }
    step() {
      this.settle();
      this.history.push({ cycle: this.cycle, inputs: { ...this.inputs }, outputs: { ...this.outputs }, state: this.fsm.currentName() });
      this.fsm.prepare();
      this.fsm.commit();
      this.cycle++;
      this.settle();
    }
    reset() { this.history.push({ reset: true }); this.fsm.reset(); this.settle(); }
  }

  Object.assign(GV, { SimError, CircuitSim, FsmSim, Simulator, FsmSimulator, compileAssigns });
})();

// ---- verilog.js ----
// Synthesizable Verilog-2001 generation for circuits, FSMs and custom blocks, plus testbench generation.
(function () {
  const GV = (globalThis.GV = globalThis.GV || {});
  const { sanitize } = GV;

  const rng = (w) => (w > 1 ? `[${w - 1}:0] ` : '');
  const hex = (v, w) => `${w}'h${BigInt(v).toString(16)}`;

  function needsClock(project, name, seen = new Set()) {
    if (seen.has(name)) return false;
    seen.add(name);
    const circ = project.circuits[name];
    if (!circ) return false;
    return circ.components.some((c) => c.type === 'register' || c.type === 'counter' || c.type === 'fsm' ||
      (c.type === 'sub' && needsClock(project, c.props.circuit, seen)));
  }

  function resetBits(project) {
    const v = project.settings.verilog;
    const clk = sanitize(v.clock || 'clk'), rst = sanitize(v.reset || 'rst');
    const cond = v.resetActiveLow ? `!${rst}` : rst;
    const edge = v.resetStyle === 'async' ? `always @(posedge ${clk} or ${v.resetActiveLow ? 'negedge' : 'posedge'} ${rst})` : `always @(posedge ${clk})`;
    return { clk, rst, cond, edge };
  }

  class Writer {
    constructor(indent) { this.lines = []; this.ind = ' '.repeat(indent); }
    line(depth, s) { this.lines.push(this.ind.repeat(depth) + s); }
    blank() { this.lines.push(''); }
    text() { return this.lines.join('\n'); }
  }

  function header(project, w, what) {
    if (!project.settings.verilog.header) return;
    w.line(0, `// ${what}`);
    w.line(0, `// Generated by Graphical Verilog from project "${project.name}"`);
  }

  function portList(w, ports) {
    w.line(0, '(');
    ports.forEach((p, i) => w.line(1, p + (i < ports.length - 1 ? ',' : '')));
    w.line(0, ');');
  }

  // ---------- Custom expression modules ----------
  function genAssignModule(project, modName, def, warnings) {
    const ins = GV.parsePortSpec(def.inputs).map((p) => ({ name: p.name, w: p.width }));
    const outs = GV.parsePortSpec(def.outputs).map((p) => ({ name: p.name, w: p.width }));
    const prog = GV.compileAssigns(def.code, ins, outs, modName);
    const w = new Writer(project.settings.verilog.indent);
    header(project, w, `Custom block ${modName}`);
    w.line(0, `module ${modName}`);
    portList(w, [...ins.map((p) => `input  wire ${rng(p.w)}${p.name}`), ...outs.map((p) => `output wire ${rng(p.w)}${p.name}`)]);
    for (const a of prog.compiled) if (a.internal) w.line(1, `wire ${rng(a.w)}${a.lhs};`);
    const assigned = new Set(prog.compiled.map((a) => a.lhs));
    for (const a of prog.compiled) w.line(1, `assign ${a.lhs} = ${a.src.replace(/\s+/g, ' ')};`);
    for (const o of outs) if (!assigned.has(o.name)) { w.line(1, `assign ${o.name} = ${o.w}'d0;`); warnings.push(`${modName}: output ${o.name} is never assigned (tied to 0)`); }
    w.line(0, 'endmodule');
    return w.text();
  }

  // ---------- FSM ----------
  function genFsm(project, name, warnings) {
    const f = project.fsms[name];
    const modName = sanitize(name);
    const v = resetBits(project);
    const ind = project.settings.verilog.indent;
    const w = new Writer(ind);
    const ins = GV.parsePortSpec(f.inputs).map((p) => ({ name: p.name, w: p.width }));
    const outs = GV.parsePortSpec(f.outputs).map((p) => ({ name: p.name, w: p.width, def: p.def }));
    if (!f.states.length) throw new GV.SimError(`State machine ${name} has no states`);
    const sb = GV.fsmStateBits(f);
    const used = new Set();
    const sname = new Map();
    f.states.forEach((s) => {
      let n = 'S_' + sanitize(s.name).toUpperCase();
      while (used.has(n)) n += '_';
      used.add(n);
      sname.set(s.id, n);
    });
    const code = (i) => {
      if (f.encoding === 'onehot') return `${sb}'b${(1n << BigInt(i)).toString(2).padStart(sb, '0')}`;
      if (f.encoding === 'gray') return `${sb}'d${i ^ (i >> 1)}`;
      return `${sb}'d${i}`;
    };
    // Validate with the simulator's compiler; it throws on bad expressions.
    const sim = new GV.FsmSim(project, name);
    const internals = new Map();
    const collect = (prog) => prog.compiled.forEach((a) => { if (a.internal) internals.set(a.lhs, a.w); });
    sim.moore.forEach(collect);
    sim.trans.forEach((list) => list.forEach((t) => collect(t.actions)));

    header(project, w, `State machine ${name} (${f.encoding} encoding, ${f.states.length} states)`);
    w.line(0, `module ${modName}`);
    portList(w, [
      `input  wire ${v.clk}`, `input  wire ${v.rst}`,
      ...ins.map((p) => `input  wire ${rng(p.w)}${p.name}`),
      ...outs.map((p) => `output reg  ${rng(p.w)}${p.name}`),
      ...(f.exposeState ? [`output wire ${rng(sb)}state`] : []),
    ]);
    w.blank();
    f.states.forEach((s, i) => w.line(1, `localparam ${rng(sb)}${sname.get(s.id)} = ${code(i)};`));
    w.blank();
    w.line(1, `reg ${rng(sb)}state_r, state_nxt;`);
    for (const [n, wd] of internals) w.line(1, `reg ${rng(wd)}${n};`);
    if (f.exposeState) w.line(1, 'assign state = state_r;');
    w.blank();
    w.line(1, `${v.edge} begin`);
    w.line(2, `if (${v.cond}) state_r <= ${sname.get(f.reset)};`);
    w.line(2, 'else state_r <= state_nxt;');
    w.line(1, 'end');
    w.blank();
    w.line(1, 'always @(*) begin');
    w.line(2, 'state_nxt = state_r;');
    for (const o of outs) w.line(2, `${o.name} = ${o.def ? hex(GV.evalConst(o.def, o.w), o.w) : `${o.w}'d0`};`);
    for (const [n, wd] of internals) w.line(2, `${n} = ${wd}'d0;`);
    w.line(2, 'case (state_r)');
    for (const s of f.states) {
      w.line(3, `${sname.get(s.id)}: begin`);
      for (const a of sim.moore.get(s.id).compiled) w.line(4, `${a.lhs} = ${a.src.replace(/\s+/g, ' ')};`);
      const list = sim.trans.get(s.id) || [];
      let first = true;
      for (const tr of list) {
        const body = (d) => {
          w.line(d, `state_nxt = ${sname.get(tr.t.to)};`);
          for (const a of tr.actions.compiled) w.line(d, `${a.lhs} = ${a.src.replace(/\s+/g, ' ')};`);
        };
        if (!tr.cond) {
          if (first) body(4);
          else { w.line(4, 'else begin'); body(5); w.line(4, 'end'); }
          break;
        }
        w.line(4, `${first ? 'if' : 'else if'} (${tr.t.cond.trim().replace(/\s+/g, ' ')}) begin`);
        body(5);
        w.line(4, 'end');
        first = false;
      }
      w.line(3, 'end');
    }
    w.line(3, `default: state_nxt = ${sname.get(f.reset)};`);
    w.line(2, 'endcase');
    w.line(1, 'end');
    w.line(0, 'endmodule');
    const reachable = new Set([f.reset]);
    let grew = true;
    while (grew) { grew = false; for (const t of f.transitions) if (reachable.has(t.from) && !reachable.has(t.to)) { reachable.add(t.to); grew = true; } }
    for (const s of f.states) if (!reachable.has(s.id)) warnings.push(`${name}: state ${s.name} is unreachable from the reset state`);
    return w.text();
  }

  // ---------- Circuits ----------
  function genCircuit(project, name, ctx) {
    const circ = project.circuits[name];
    const modName = sanitize(name);
    const v = resetBits(project);
    const w = new Writer(project.settings.verilog.indent);
    const warnings = ctx.warnings;
    const clocked = needsClock(project, name);
    const comps = [...circ.components].filter((c) => GV.TYPES[c.type] && c.type !== 'note' && c.type !== 'probe').sort((a, b) => a.y - b.y || a.x - b.x);
    const ports = new Map(comps.map((c) => [c.id, GV.getPorts(c, project)]));

    // Port names
    const io = GV.circuitPorts(project, name);
    const taken = new Set([...io.ins, ...io.outs].map((p) => p.name));
    const seenPort = new Set();
    for (const p of [...io.ins, ...io.outs]) {
      if (seenPort.has(p.name)) throw new GV.SimError(`${name}: two ports are named '${p.name}'`);
      seenPort.add(p.name);
    }
    if (clocked) {
      for (const n of [v.clk, v.rst]) {
        if (taken.has(n)) throw new GV.SimError(`${name}: port '${n}' clashes with the implicit clock/reset name (rename it, or change the names in Settings)`);
        taken.add(n);
      }
    }
    const unique = (base) => { let n = base, k = 2; while (taken.has(n)) n = base + '_' + k++; taken.add(n); return n; };

    // Net name for every output pin.
    const net = new Map();
    const counters = {};
    const baseName = new Map();
    for (const c of comps) {
      const P = ports.get(c.id);
      if (c.type === 'input') { net.set(c.id + ':out', { name: sanitize(c.props.name), w: P.outs[0].w }); continue; }
      counters[c.type] = (counters[c.type] || 0) + 1;
      const base = c.label ? sanitize(c.label) : `${c.type}${counters[c.type]}`;
      baseName.set(c.id, c.label ? unique(base) : unique(base));
      for (const p of P.outs) {
        const n = P.outs.length === 1 ? baseName.get(c.id) : unique(baseName.get(c.id) + '_' + p.name);
        net.set(c.id + ':' + p.name, { name: n, w: p.w });
      }
    }
    const driver = new Map(circ.wires.map((wr) => [wr.to.c + ':' + wr.to.p, wr.from.c + ':' + wr.from.p]));

    const decls = [];
    const body = [];
    const adapters = [];
    const regNets = new Set();
    const labelOf = (c) => c.label || `${GV.TYPES[c.type].label} (${c.type === 'input' || c.type === 'output' ? c.props.name : c.id})`;

    // An identifier carrying exactly the pin width.
    const pin = (c, idx) => {
      const p = ports.get(c.id).ins[idx];
      const src = driver.get(c.id + ':' + p.name);
      const s = src && net.get(src);
      if (!s) {
        warnings.push(`${name}: ${labelOf(c)} input '${p.name}' is not connected (tied to 0)`);
        return `${p.w}'d0`;
      }
      if (s.w === p.w) return s.name;
      const n = unique(`${baseName.get(c.id) || 'n'}_${p.name}`);
      const expr = s.w > p.w ? `${s.name}[${p.w - 1}:0]` : `{{${p.w - s.w}{1'b0}}, ${s.name}}`;
      adapters.push(`wire ${rng(p.w)}${n} = ${expr};`);
      if (s.w > p.w) warnings.push(`${name}: ${labelOf(c)} input '${p.name}' is ${p.w} bit(s) but its wire carries ${s.w}; upper bits dropped`);
      return n;
    };
    // pin(), but guaranteed to be a plain identifier (literals get a named wire).
    const pinId = (c, idx) => {
      const e = pin(c, idx);
      if (/^[A-Za-z_]/.test(e)) return e;
      const p = ports.get(c.id).ins[idx];
      const n = unique(`${baseName.get(c.id) || 'n'}_${p.name}`);
      adapters.push(`wire ${rng(p.w)}${n} = ${e};`);
      return n;
    };
    const out = (c, p = null) => {
      const P = ports.get(c.id);
      return net.get(c.id + ':' + (p || P.outs[0].name)).name;
    };

    for (const c of comps) {
      const P = ports.get(c.id);
      const t = c.type;
      for (const p of P.outs) {
        if (t === 'input') continue;
        const n = net.get(c.id + ':' + p.name);
        const isReg = t === 'register' || t === 'counter';
        if (isReg) regNets.add(n.name);
        decls.push(`${isReg ? 'reg ' : 'wire'} ${rng(n.w)}${n.name};`);
      }
      const gateOp = GV.GATE_OPS[t];
      if (gateOp) {
        const terms = P.ins.map((_, i) => pin(c, i)).join(` ${gateOp} `);
        body.push(`assign ${out(c)} = ${['nand', 'nor', 'xnor'].includes(t) ? `~(${terms})` : terms};`);
        continue;
      }
      switch (t) {
        case 'input': break;
        case 'output': body.push(`assign ${sanitize(c.props.name)} = ${pin(c, 0)};`); break;
        case 'const': body.push(`assign ${out(c)} = ${hex(GV.evalConst(c.props.value || '0', P.outs[0].w), P.outs[0].w)};`); break;
        case 'not': body.push(`assign ${out(c)} = ~${pin(c, 0)};`); break;
        case 'mux': {
          const sel = pin(c, P.ins.length - 1);
          const n = P.ins.length - 1;
          const sw = P.ins[n].w;
          let e = pin(c, n - 1);
          for (let i = n - 2; i >= 0; i--) e = `(${sel} == ${sw}'d${i}) ? ${pin(c, i)} : ${e}`;
          body.push(`assign ${out(c)} = ${e};`);
          break;
        }
        case 'decoder': body.push(`assign ${out(c)} = ${P.outs[0].w}'d1 << ${pin(c, 0)};`); break;
        case 'slice': {
          const a = pinId(c, 0);
          const hi = c.props.lo + P.outs[0].w - 1;
          body.push(`assign ${out(c)} = ${P.ins[0].w === 1 ? a : hi === c.props.lo ? `${a}[${hi}]` : `${a}[${hi}:${c.props.lo | 0}]`};`);
          break;
        }
        case 'concat': body.push(`assign ${out(c)} = {${P.ins.map((_, i) => pin(c, i)).join(', ')}};`); break;
        case 'extend': {
          const a = pinId(c, 0), fw = P.ins[0].w, tw = P.outs[0].w;
          let e = a;
          if (tw > fw) e = c.props.sign ? `{{${tw - fw}{${fw === 1 ? a : `${a}[${fw - 1}]`}}}, ${a}}` : `{{${tw - fw}{1'b0}}, ${a}}`;
          body.push(`assign ${out(c)} = ${e};`);
          break;
        }
        case 'op': body.push(`assign ${out(c)} = ${pin(c, 0)} ${c.props.op} ${pin(c, 1)};`); break;
        case 'adder': body.push(`assign {${out(c, 'cout')}, ${out(c, 'sum')}} = ${pin(c, 0)} + ${pin(c, 1)} + ${pin(c, 2)};`); break;
        case 'register': {
          const q = out(c), wd = P.outs[0].w;
          body.push(`${v.edge} begin`);
          body.push(`  if (${v.cond}) ${q} <= ${hex(GV.evalConst(c.props.reset || '0', wd), wd)};`);
          body.push(`  else${c.props.enable ? ` if (${pin(c, 1)})` : ''} ${q} <= ${pin(c, 0)};`);
          body.push('end');
          break;
        }
        case 'counter': {
          const q = out(c), wd = P.outs[0].w;
          const rv = hex(GV.evalConst(c.props.reset || '0', wd), wd);
          body.push(`${v.edge} begin`);
          body.push(`  if (${v.cond}) ${q} <= ${rv};`);
          if (c.props.clear) body.push(`  else if (${pin(c, 1)}) ${q} <= ${rv};`);
          body.push(`  else if (${pin(c, 0)}) ${q} <= ${q} ${c.props.down ? '-' : '+'} ${wd}'d${Math.max(1, c.props.step | 0)};`);
          body.push('end');
          break;
        }
        case 'expr':
        case 'lib':
        case 'sub':
        case 'fsm': {
          let mod;
          if (t === 'expr') mod = ctx.exprModule(c);
          else if (t === 'lib') mod = ctx.libModule(c.props.lib);
          else if (t === 'sub') {
            if (!project.circuits[c.props.circuit]) throw new GV.SimError(`${name}: subcircuit '${c.props.circuit}' does not exist`);
            mod = sanitize(c.props.circuit);
          } else {
            if (!project.fsms[c.props.fsm]) throw new GV.SimError(`${name}: state machine '${c.props.fsm}' does not exist`);
            mod = sanitize(c.props.fsm);
          }
          const conns = [];
          if ((t === 'sub' && needsClock(project, c.props.circuit)) || t === 'fsm') conns.push(`.${v.clk}(${v.clk})`, `.${v.rst}(${v.rst})`);
          P.ins.forEach((p, i) => conns.push(`.${p.name}(${pin(c, i)})`));
          P.outs.forEach((p) => conns.push(`.${p.name}(${out(c, p.name)})`));
          body.push(`${mod} u_${baseName.get(c.id)} (`);
          conns.forEach((cn, i) => body.push(`  ${cn}${i < conns.length - 1 ? ',' : ''}`));
          body.push(');');
          break;
        }
      }
    }

    const ind = ' '.repeat(project.settings.verilog.indent);
    const fix = (s) => s.replace(/^( +)/, (m) => ind.repeat(m.length / 2));
    header(project, w, `Circuit ${name}`);
    w.line(0, `module ${modName}`);
    portList(w, [
      ...(clocked ? [`input  wire ${v.clk}`, `input  wire ${v.rst}`] : []),
      ...io.ins.map((p) => `input  wire ${rng(p.w)}${p.name}`),
      ...io.outs.map((p) => `output wire ${rng(p.w)}${p.name}`),
    ]);
    if (decls.length || adapters.length) w.blank();
    decls.forEach((d) => w.line(1, d));
    adapters.forEach((d) => w.line(1, d));
    if (body.length) w.blank();
    body.forEach((b) => w.line(1, fix(b)));
    w.line(0, 'endmodule');
    if (!io.ins.length && !io.outs.length) warnings.push(`${name}: circuit has no input or output ports`);
    return w.text();
  }

  function circuitOrder(project, top) {
    const order = [];
    const state = new Map();
    const visit = (n, path) => {
      if (state.get(n) === 'done') return;
      if (state.get(n) === 'busy') throw new GV.SimError('Subcircuit includes itself: ' + [...path, n].join(' → '));
      state.set(n, 'busy');
      const circ = project.circuits[n];
      if (circ) for (const c of circ.components) if (c.type === 'sub' && project.circuits[c.props.circuit]) visit(c.props.circuit, [...path, n]);
      state.set(n, 'done');
      order.push(n);
    };
    if (project.circuits[top]) visit(top, []);
    for (const n of Object.keys(project.circuits)) visit(n, []);
    return order;
  }

  // Generate every module. Returns { modules:[{name, kind, code}], text, warnings, errors }.
  function generateProject(project) {
    const warnings = [];
    const errors = [];
    const modules = [];
    const moduleNames = new Set();
    const claim = (n) => { let m = n, k = 2; while (moduleNames.has(m)) m = n + '_' + k++; moduleNames.add(m); return m; };
    Object.keys(project.circuits).forEach((n) => moduleNames.add(sanitize(n)));
    Object.keys(project.fsms).forEach((n) => moduleNames.add(sanitize(n)));

    const exprMods = new Map();
    const libMods = new Map();
    const ctx = {
      warnings,
      exprModule(c) {
        const key = JSON.stringify([c.props.inputs, c.props.outputs, c.props.code]);
        if (exprMods.has(key)) return exprMods.get(key);
        const mn = claim('blk_' + sanitize(c.props.title || 'expr'));
        exprMods.set(key, mn);
        modules.push({ name: mn, kind: 'block', code: genAssignModule(project, mn, c.props, warnings) });
        return mn;
      },
      libModule(lib) {
        if (libMods.has(lib)) return libMods.get(lib);
        const def = project.library[lib];
        if (!def) throw new GV.SimError(`Library block '${lib}' not found`);
        const mn = claim(sanitize(lib));
        libMods.set(lib, mn);
        modules.push({ name: mn, kind: 'library', code: genAssignModule(project, mn, def, warnings) });
        return mn;
      },
    };
    for (const n of Object.keys(project.fsms)) {
      try { modules.push({ name: sanitize(n), kind: 'fsm', code: genFsm(project, n, warnings) }); } catch (e) { errors.push(e.message); }
    }
    let order = [];
    try { order = circuitOrder(project, project.top); } catch (e) { errors.push(e.message); }
    for (const n of order) {
      try { modules.push({ name: sanitize(n), kind: 'circuit', code: genCircuit(project, n, ctx) }); } catch (e) { errors.push(e.message); }
    }
    const text = modules.map((m) => m.code).join('\n\n') + '\n';
    return { modules, text, warnings: [...new Set(warnings)], errors };
  }

  // Self-checking testbench from a recorded simulation history.
  function generateTestbench(project, circuitName, history) {
    const v = resetBits(project);
    const io = GV.circuitPorts(project, circuitName);
    const clocked = needsClock(project, circuitName);
    const tb = 'tb_' + sanitize(circuitName);
    const act = project.settings.verilog.resetActiveLow ? "1'b0" : "1'b1";
    const inact = project.settings.verilog.resetActiveLow ? "1'b1" : "1'b0";
    const L = [];
    L.push('`timescale 1ns/1ps');
    L.push(`// Self-checking testbench recorded from the Graphical Verilog simulator (${history.filter((h) => !h.reset).length} cycles).`);
    L.push(`module ${tb};`);
    L.push(`  reg ${v.clk} = 1'b0;`);
    L.push(`  reg ${v.rst} = ${act};`);
    io.ins.forEach((p) => L.push(`  reg ${rng(p.w)}${p.name} = ${p.w}'d0;`));
    io.outs.forEach((p) => L.push(`  wire ${rng(p.w)}${p.name};`));
    L.push('  integer errors = 0;');
    L.push('');
    const conns = [...(clocked ? [`.${v.clk}(${v.clk})`, `.${v.rst}(${v.rst})`] : []), ...io.ins.map((p) => `.${p.name}(${p.name})`), ...io.outs.map((p) => `.${p.name}(${p.name})`)];
    L.push(`  ${sanitize(circuitName)} dut (${conns.join(', ')});`);
    L.push('');
    L.push(`  always #5 ${v.clk} = ~${v.clk};`);
    L.push('');
    L.push('  initial begin');
    L.push(`    $dumpfile("${tb}.vcd");`);
    L.push(`    $dumpvars(0, ${tb});`);
    L.push(`    @(posedge ${v.clk}); #1 ${v.rst} = ${inact};`);
    let n = 0;
    for (const h of history) {
      if (h.reset) {
        L.push(`    // reset`);
        L.push(`    ${v.rst} = ${act}; @(posedge ${v.clk}); #1 ${v.rst} = ${inact};`);
        continue;
      }
      n++;
      L.push(`    // cycle ${h.cycle}`);
      const sets = io.ins.map((p) => `${p.name} = ${hex(h.inputs[p.name] ?? 0n, p.w)};`);
      if (sets.length) L.push('    ' + sets.join(' '));
      L.push('    #1;');
      for (const p of io.outs) {
        const e = hex(h.outputs[p.name] ?? 0n, p.w);
        L.push(`    if (${p.name} !== ${e}) begin errors = errors + 1; $display("cycle ${h.cycle}: ${p.name} = %h, expected %h", ${p.name}, ${e}); end`);
      }
      L.push(`    @(posedge ${v.clk}); #1;`);
    }
    L.push(`    if (errors == 0) $display("PASS: ${n} cycles match the Graphical Verilog simulation");`);
    L.push('    else $display("FAIL: %0d mismatches", errors);');
    L.push('    $finish;');
    L.push('  end');
    L.push('endmodule');
    return L.join('\n') + '\n';
  }

  Object.assign(GV, { generateProject, generateTestbench, needsClock });
})();

// ---- examples.js ----
// Built-in example projects.
(function () {
  const GV = (globalThis.GV = globalThis.GV || {});

  function comp(id, type, x, y, props, label = '') {
    return { id, type, x, y, label, props: { ...JSON.parse(JSON.stringify(GV.TYPES[type].defaults)), ...props } };
  }
  const wire = (id, fc, fp, tc, tp) => ({ id, from: { c: fc, p: fp }, to: { c: tc, p: tp } });

  function tour() {
    const p = GV.newProject();
    p.name = 'Getting started tour';
    p.circuits.main = {
      name: 'main',
      components: [
        comp('n1', 'note', 40, -60, { text: 'Click Simulate, then click inputs to change them and press Step to clock the design. Double-click a block to open it.', width: 520 }),
        comp('ia', 'input', 40, 40, { name: 'a', width: 4 }),

// ---- app.js ----
// Application shell: state, undo/redo, persistence, top bar, menus, settings and simulation control.
(function () {
  const GV = globalThis.GV;
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  GV.$ = $;
  GV.esc = esc;
  const STORE = 'graphical-verilog.project.v1';

  const App = (GV.App = {
    project: null,
    tab: 'circuit',
    circuit: 'main',
    fsm: null,
    sel: new Set(),
    fsmSel: null,
    views: {},
    sim: null,
    simOn: false,
    simError: null,
    runTimer: null,
    undoStack: [],
    redoStack: [],
    lastSaved: null,

    init() {
      let p = null;
      try { const raw = localStorage.getItem(STORE); if (raw) p = JSON.parse(raw); } catch (e) { p = null; }
      if (!p) p = GV.EXAMPLES['Getting started tour']();
      this.load(p, true);
      bindTopbar();
      document.addEventListener('keydown', onKey);
      window.addEventListener('resize', () => this.renderCanvas());
    },

    load(p, keepHistory) {
      this.stopSim();
      this.project = GV.normalizeProject(p);
      this.circuit = this.project.circuits[this.project.top] ? this.project.top : Object.keys(this.project.circuits)[0];
      this.fsm = Object.keys(this.project.fsms)[0] || null;
      this.sel.clear();
      this.fsmSel = null;
      this.views = {};
      if (!keepHistory) { this.undoStack = []; this.redoStack = []; }
      this.applyTheme();
      this.render();
      this.save();
    },

    // Call before mutating the project so the change can be undone.
    checkpoint() {
      this.undoStack.push(JSON.stringify(this.project));
      if (this.undoStack.length > 200) this.undoStack.shift();
      this.redoStack = [];
    },

    // Call after mutating the project.
    changed(opts = {}) {
      GV.pruneWires(this.project);
      if (this.simOn) this.rebuildSim();
      this.scheduleSave();
      if (opts.canvasOnly) this.renderCanvas();
      else this.render();
    },

    undo() { this.swapHistory(this.undoStack, this.redoStack); },
    redo() { this.swapHistory(this.redoStack, this.undoStack); },
    swapHistory(from, to) {
      if (!from.length) return;
      to.push(JSON.stringify(this.project));
      this.project = GV.normalizeProject(JSON.parse(from.pop()));
      if (!this.project.circuits[this.circuit]) this.circuit = this.project.top;
      if (this.fsm && !this.project.fsms[this.fsm]) this.fsm = Object.keys(this.project.fsms)[0] || null;
      this.sel.clear();
      this.fsmSel = null;
      this.applyTheme();
      this.changed();
    },

    scheduleSave() {
      clearTimeout(this.saveTimer);
      this.saveTimer = setTimeout(() => this.save(), 400);
    },
    save() {
      try { localStorage.setItem(STORE, JSON.stringify(this.project)); this.lastSaved = new Date(); } catch (e) { this.lastSaved = null; }
      this.renderStatus();
    },

    get settings() { return this.project.settings; },
    get circ() { return this.project.circuits[this.circuit]; },

    applyTheme() {
      const s = this.settings;
      if (s.theme === 'light' || s.theme === 'dark') { document.documentElement.dataset.theme = s.theme; this.themeSet = true; }
      else if (this.themeSet) { delete document.documentElement.dataset.theme; this.themeSet = false; }
      document.documentElement.style.setProperty('--accent', s.accent);
    },

    // ---------- rendering ----------
    render() {
      this.renderTop();
      this.renderLeft();
      this.renderRight();
      this.renderCanvas();
      this.renderStatus();
    },
    ui() { return this.tab === 'circuit' ? GV.CircuitUI : this.tab === 'fsm' ? GV.FsmUI : GV.VerilogUI; },
    renderLeft() { this.ui().renderLeft($('#left')); },
    renderRight() { this.ui().renderRight($('#right')); },
    renderCanvas() {
      $('#circuitCanvas').style.display = this.tab === 'circuit' ? '' : 'none';
      $('#fsmCanvas').style.display = this.tab === 'fsm' ? '' : 'none';
      $('#verilogView').style.display = this.tab === 'verilog' ? 'block' : 'none';
      this.ui().renderCanvas();
      GV.Wave.render();
    },
    renderTop() {
      $('#projName').value = this.project.name;
      document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('active', b.dataset.tab === this.tab));
      const canSim = this.tab !== 'verilog' && (this.tab === 'circuit' || this.fsm);
      $('#simToggle').disabled = !canSim;
      $('#simToggle').classList.toggle('on', this.simOn);
      $('#simToggle').textContent = this.simOn ? '■ Stop' : '▶ Simulate';
      for (const id of ['simReset', 'simStep', 'simRun']) $('#' + id).disabled = !this.simOn || !this.sim;
      $('#simRun').textContent = this.runTimer ? '⏸ Pause' : '⏵ Run';
      $('#simRun').classList.toggle('on', !!this.runTimer);
      $('#cycle').textContent = this.sim ? `cycle ${this.sim.cycle}` : '';
      $('#undoBtn').disabled = !this.undoStack.length;
      $('#redoBtn').disabled = !this.redoStack.length;
    },
    renderStatus() {
      const el = $('#status');
      if (!el || !this.project) return;
      const parts = [];
      if (this.tab === 'circuit') {
        const c = this.circ;
        parts.push(`<span>Circuit <b>${esc(this.circuit)}</b>${this.circuit === this.project.top ? ' (top)' : ''} · ${c.components.length} blocks · ${c.wires.length} wires</span>`);
      } else if (this.tab === 'fsm' && this.fsm) {
        const f = this.project.fsms[this.fsm];
        parts.push(`<span>State machine <b>${esc(this.fsm)}</b> · ${f.states.length} states · ${f.transitions.length} transitions</span>`);
      }
      if (this.simError) parts.push(`<span class="err">⚠ ${esc(this.simError)}</span>`);
      else if (this.simOn) parts.push(`<span class="ok">● Simulating${this.runTimer ? ` at ${this.settings.simSpeed} Hz` : ''}</span>`);
      parts.push('<span class="spacer"></span>');
      parts.push(`<span>${this.lastSaved ? 'Saved in this browser' : 'Not saved (browser storage unavailable): use File → Save project'}</span>`);
      el.innerHTML = parts.join('');
    },

    setTab(t) {
      if (t === this.tab) return;
      const wasSim = this.simOn;
      this.stopSim();
      this.tab = t;
      if (wasSim && t !== 'verilog') this.startSim();
      this.render();
    },
    openCircuit(n) {
      const wasSim = this.simOn;
      this.stopSim();
      this.circuit = n;
      this.sel.clear();
      this.tab = 'circuit';
      if (wasSim) this.startSim();
      this.render();
    },
    openFsm(n) {
      const wasSim = this.simOn;
      this.stopSim();
      this.fsm = n;
      this.fsmSel = null;
      this.tab = 'fsm';
      if (wasSim) this.startSim();
      this.render();
    },

    // ---------- simulation ----------
    startSim() {
      this.simOn = true;
      this.rebuildSim();
      $('#wave').classList.add('show');
      this.render();
    },
    stopSim() {
      this.pauseRun();
      this.simOn = false;
      this.sim = null;
      this.simError = null;
      $('#wave').classList.remove('show');
    },
    rebuildSim() {
      const prev = this.sim;
      this.sim = null;
      this.simError = null;
      try {
        if (this.tab === 'circuit') this.sim = new GV.Simulator(this.project, this.circuit);
        else if (this.tab === 'fsm' && this.fsm) this.sim = new GV.FsmSimulator(this.project, this.fsm);
        if (prev && this.sim && prev.constructor === this.sim.constructor) {
          for (const k in this.sim.inputs) if (k in prev.inputs) this.sim.inputs[k] = prev.inputs[k];
          this.sim.settle();
        }
      } catch (e) {
        this.sim = null;
        this.simError = e.message;
        this.pauseRun();
      }
    },
    simAction(fn) {
      if (!this.sim) return;
      try { fn(this.sim); this.simError = null; } catch (e) { this.simError = e.message; this.pauseRun(); }
      this.renderTop();
      this.renderCanvas();
      this.ui().renderSimPanel?.();
      this.renderStatus();
    },
    step() { this.simAction((s) => s.step()); },
    resetSim() { this.simAction((s) => s.reset()); },
    setInput(name, v) { this.simAction((s) => s.setInput(name, v)); },
    toggleRun() {
      if (this.runTimer) this.pauseRun();
      else if (this.sim) this.runTimer = setInterval(() => this.step(), 1000 / Math.max(0.5, this.settings.simSpeed));
      this.renderTop();
      this.renderStatus();
    },
    pauseRun() { clearInterval(this.runTimer); this.runTimer = null; },

    // ---------- names ----------
    nameTaken(n, except) {
      const p = this.project;
      const s = GV.sanitize(n);
      return [...Object.keys(p.circuits), ...Object.keys(p.fsms), ...Object.keys(p.library)].some((k) => k !== except && GV.sanitize(k) === s);
    },
    freshName(base) {
      let n = base, k = 2;
      while (this.nameTaken(n)) n = base + '_' + k++;
      return n;
    },
    validModuleName(n, except) {
      if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(n)) return 'Use letters, digits and _ (not starting with a digit)';
      if (GV.VERILOG_KEYWORDS.has(n)) return `'${n}' is a Verilog keyword`;
      if (this.nameTaken(n, except)) return `'${n}' is already used`;
      return null;
    },
    renameModule(kind, oldName, newName) {
      const err = this.validModuleName(newName, oldName);
      if (err) { GV.alert(err); return false; }
      this.checkpoint();
      const p = this.project;
      const key = { circuits: 'circuit', fsms: 'fsm', library: 'lib' }[kind];
      const obj = p[kind][oldName];
      delete p[kind][oldName];
      obj.name = newName;
      p[kind][newName] = obj;
      for (const c of Object.values(p.circuits)) for (const comp of c.components) if (comp.props[key] === oldName) comp.props[key] = newName;
      if (kind === 'circuits') { if (p.top === oldName) p.top = newName; if (this.circuit === oldName) this.circuit = newName; }
      if (kind === 'fsms' && this.fsm === oldName) this.fsm = newName;
      this.changed();
      return true;
    },
    usages(key, name) {
      const res = [];
      for (const c of Object.values(this.project.circuits)) for (const comp of c.components) if (comp.props[key] === name) res.push(c.name);
      return [...new Set(res)];
    },
  });

  // ---------- dialogs ----------
  // Inside an embedded viewer (iframe) downloads are blocked, so offer copying instead.
  const embedded = (() => { try { return window.self !== window.top; } catch { return true; } })();
  function textDialog(title, filename, text, note) {
    const dlg = $('#settingsDlg');
    dlg.innerHTML = `<div class="head">${esc(title)}<span class="spacer"></span><button data-x>✕</button></div>
      <div class="body">${note ? `<p class="help">${note}</p>` : ''}<textarea class="mono" style="height:50vh" readonly>${esc(text)}</textarea></div>
      <div class="foot">${embedded ? `<span class="help" style="margin-right:auto">Copy, then save as ${esc(filename)}</span>` : ''}<button data-copy ${embedded ? 'class="primary"' : ''}>Copy</button>${embedded ? '' : `<button class="primary" data-dl>Download ${esc(filename)}</button>`}</div>`;
    dlg.querySelector('[data-x]').onclick = () => dlg.close();
    dlg.querySelector('[data-copy]').onclick = async (e) => {
      const ta = dlg.querySelector('textarea');
      try { await navigator.clipboard.writeText(text); } catch { ta.select(); document.execCommand('copy'); }
      e.target.textContent = 'Copied';
    };
    if (!embedded) dlg.querySelector('[data-dl]').onclick = () => download(filename, text);
    dlg.showModal();
  }
  GV.textDialog = textDialog;

  // In-page replacements for alert/confirm/prompt (native ones are unavailable in embedded viewers).
  GV.ask = function (message, opts = {}) {
    return new Promise((resolve) => {
      const dlg = $('#askDlg');
      const hasInput = opts.input != null;
      dlg.innerHTML = `<form method="dialog"><div class="body"><p style="margin:0 0 10px;white-space:pre-wrap">${esc(message)}</p>
        ${hasInput ? `<input type="text" id="askInput" value="${esc(opts.input)}" spellcheck="false">` : ''}</div>
        <div class="foot">${opts.alert ? '' : '<button type="button" data-no>Cancel</button>'}<button type="submit" class="${opts.danger ? 'primary danger-fill' : 'primary'}">${esc(opts.ok || 'OK')}</button></div></form>`;
      let done = false;
      const finish = (v) => { if (done) return; done = true; dlg.close(); resolve(v); };
      dlg.querySelector('form').onsubmit = (e) => { e.preventDefault(); finish(hasInput ? dlg.querySelector('#askInput').value.trim() || null : true); };
      const no = dlg.querySelector('[data-no]');
      if (no) no.onclick = () => finish(hasInput ? null : false);
      dlg.onclose = () => finish(hasInput ? null : !!opts.alert);
      dlg.showModal();
      const inp = dlg.querySelector('#askInput');
      if (inp) { inp.focus(); inp.select(); }
    });
  };
  GV.alert = (message) => GV.ask(message, { alert: true, ok: 'OK' });

  function download(filename, text) {
    const blob = new Blob([text], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  GV.download = download;

  }
